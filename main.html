<!DOCTYPE html>
<html lang="fa">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="flex-sources.css">
    <link rel="stylesheet" href="items.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="extract.css">
    <link rel="stylesheet" href="golden-text.css">
    <link rel="stylesheet" href="vip-popup.css">
    
    <title>Airdrop</title>
  </head>
  <body dir="rtl" >
    <div class="screen">

      <div class="container">

        <div class="header">

          <div id="app-name" class="right-side">
            <img class="hamburger-menu " src="images/icons/hamburger-menu.svg">
            <p class="header-title">
              تخم مرغ امپایر
            </p>
          </div>

          <div class="left-side">
            <div class="gem-container">
              <div class="gem-icon-container">
                <div><img class="gem-icon" src="images/game ui/green-diamond.png"></div>
              </div>
              <div class="gem-qty">۲۵</div>
            </div>
          </div>
          
        </div>

        <div class="full-screen">

          <div class="screen-top">
            <!-- Budget -->
            <div class="screen-top-right">
              <div class="r-2r">
                <div class="budget-container"><img class="budget" src="images/game ui/irr-webp.webp"></div>
              </div>
              
              <div class="r-2l">
                <div class="r-2l-top"><p class="r-2l-top-txt">بودجه کل</p></div>
                <div class="r-2l-bottom">
                  <div class="budget-container-js" id="content">
                    <div class="budget-container-js-txt-container" id="money">1234567890</div>
                    
                    <div class="toman-label">تومان</div>
                  </div>
                </div>
              </div>

            <!-- Eggs -->
            </div>
            <div class="screen-top-left">
              <div class="r-2r">
                <div class="budget-container"><img class="budget" src="images/game ui/boxes.webp"></div>
              </div>
              
              <div class="r-2l">
                <div class="r-2l-top"><p class="r-2l-top-txt">بسته های موجود</p>
                <div class="sell-boxes">
                  <button class="sell-btn" id="sell-box" onclick="sellBox();">فروش</button>
                </div>
                </div>
                <div class="r-2l-bottom">
                  <div class="budget-container-js" id="content">
                    <div class="budget-container-js-txt-container" id="boxes"></div>
                    
                    <div class="toman-label" style="padding-left: 5px;">عدد</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="notification"></div>
          <div id="error-notif"></div>
          <div id="vip-notif"></div>

          <div class="screen-center">
            <div id="vip-card" onclick="togglePopup(true)" class="vip-container">
              <img class="vip-photo" src="images/game ui/VIP-PASS.webp" alt="">
              <div><p class="vip-text ">خرید اشتراک</p></div>
            </div>
            <img class="btn-airdrop" src="images/game ui/level1.webp" id="airdrop" onclick="
              collectEggs();
            ">
          </div>

          <div class="label-container">
            <div class="qty-label">
              <div class="qty-label-top"><h1 class="with-shadow">تخم مرغ های جمع آوری شده</h1></div>

                <div class="qty-label-bottom" id="eggs"></div>

                <button onclick="classification();" class="classification">بسته بندی</button>
                <div class="capacity-label">100/100</div>
              
            </div>
          </div>

          <div class="screen-bottom"  id="content-nav">
            <div class="nav-card">
              <div class="card-top">
                <div class="price-label">۷۰۰,۰۰۰</div>
                <div><img class="card-icon" src="images/game ui/nav-chicken.webp"></div>
              </div>

              <div class="card-middle">
                <p id="chickens">تعداد: 1</p>
              </div>

              <div class="card-bottom">
                <button class="btn-buy" onclick="buyChicken();">خرید</button>
              </div>
            </div>

            <div class="nav-card">
              <div class="card-top">
                <div class="price-label">۱۰۰,۰۰۰,۰۰۰</div>
                <div><img class="card-icon" src="images/game ui/nav-warehouse.webp"></div>
              </div>
              
              <div class="card-middle">
                <p id="warehouse">سطح: 1</p>
              </div>

              <div class="card-bottom">
                <button onclick="upgradeWarehouse();" class="btn-buy">ارتقا</button>
              </div>
            </div>

            <div class="nav-card">
              <div class="card-top">
                <div class="price-label">۲۰,۰۰۰,۰۰۰</div>
                <div><img class="card-icon" src="images/game ui/nav-cargo-vehicle1.webp"></div>
              </div>
              
              <div class="card-middle">
                <p id="vehicle">تعداد: 1</p>
              </div>

              <div class="card-bottom">
                <button onclick="vehicle();" class="btn-buy">خرید</button>
              </div>
            </div>

            <div class="nav-card">
              <div class="card-top">
                <div>
                  <img class="vip-small-icon" src="images/icons/icon-vip.webp" alt="">
                </div>
                <div class="price-label" style="padding: 0px 5px;">رایگان</div>
                <div><img class="card-icon" src="images/game ui/nav-delivery-man.webp"></div>
              </div>
              
              <div id="workerTitle" class="card-middle">
                کارمند:
                <span style="color: #e93532; padding-right: 5px;">غیرفعال</span>
              </div>

              <div class="card-bottom">
                <button id="workerButton" onclick="workerActivator();" class="btn-buy">استخدام</button>
              </div>
            </div>

          </div>
          

        </div>
      </div>
    </div>

    <script src="backend.js"></script>

  </body>
</html>
